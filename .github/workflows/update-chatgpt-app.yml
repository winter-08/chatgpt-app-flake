name: Update chatgpt-app

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  update:
    name: Update Linux release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Update package metadata
        run: nix run .#update-chatgpt-app

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Build package
        run: nix build .#chatgpt-app --print-build-logs

      # The checks above verify the new pin, so the commit goes straight to
      # main. Routing it through a pull request would gain nothing: a PR opened
      # with GITHUB_TOKEN cannot start its own CI run, so the check would never
      # report back.
      - name: Commit update
        run: |
          if git diff --quiet -- pkgs/chatgpt-app/package.nix; then
            echo "Already on the latest upstream release; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update chatgpt-app" -- pkgs/chatgpt-app/package.nix
          git push origin HEAD:main
